name: Test digest input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get digest for release asset
        id: get-digest
        run: |
          # Download the asset and compute its SHA256 digest to use in the test
          ASSET_URL="https://github.com/cli/cli/releases/download/v2.40.0/gh_2.40.0_linux_amd64.tar.gz"
          DIGEST=$(curl -sfL "$ASSET_URL" | sha256sum | awk '{print $1}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Computed digest: $DIGEST"
      - id: action
        uses: .
        with:
          repo: cli/cli
          tag: v2.40.0
          platform: linux
          arch: amd64
          extension: tar.gz
          digest: ${{ steps.get-digest.outputs.digest }}
      - name: Assert gh binary is installed
        run: |
          if ! command -v gh &>/dev/null; then
            echo "FAIL: gh binary not found in PATH"
            exit 1
          fi
          echo "PASS: gh binary found at $(command -v gh)"
