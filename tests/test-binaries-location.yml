name: Test binaries-location
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repo: cli/cli
          tag: v2.40.0
          binaries-location: gh_2.40.0_linux_amd64/bin
      - name: Assert gh from nested bin directory is on PATH
        run: |
          BIN="$(command -v gh || true)"
          echo "gh path: $BIN"
          echo "PATH=$PATH"
          if [ -z "$BIN" ]; then
            echo "FAIL: gh not found on PATH"
            exit 1
          fi
          case "$BIN" in
            */cli/cli/v2.40.0/*gh_2.40.0_linux_amd64/bin/gh) ;;
            *) echo "FAIL: gh not resolved from binaries-location dir"; exit 1 ;;
          esac
          VERSION="$(gh --version 2>&1)"
          echo "version: $VERSION"
          if ! echo "$VERSION" | grep -q "2.40.0"; then
            echo "FAIL: expected version 2.40.0"
            exit 1
          fi
          echo "PASS"
