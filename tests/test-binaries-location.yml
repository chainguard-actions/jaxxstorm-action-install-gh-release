name: Test install binary with binaries-location (subdirectory in archive)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up runner environment
        run: |
          mkdir -p /tmp/hostedtoolcache
          mkdir -p /tmp/runner-temp
          echo "RUNNER_TOOL_CACHE=/tmp/hostedtoolcache" >> "$GITHUB_ENV"
          echo "RUNNER_TEMP=/tmp/runner-temp" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          repo: helm/helm
          tag: v3.13.3
          binaries-location: linux-amd64
        continue-on-error: true
      - name: Assert helm binary is installed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking for helm binary..."
            # core.addPath may not persist in act; search the tool cache directly
            HELM_BIN=$(find /tmp/hostedtoolcache -name "helm" -type f 2>/dev/null | head -1)
            if [ -n "$HELM_BIN" ]; then
              echo "Found helm at: $HELM_BIN"
              chmod +x "$HELM_BIN"
              HELM_VERSION=$("$HELM_BIN" version --short 2>&1)
              echo "helm version: $HELM_VERSION"
              if echo "$HELM_VERSION" | grep -q "v3.13.3"; then
                echo "PASS: helm v3.13.3 is installed in tool cache"
                exit 0
              else
                echo "FAIL: expected helm v3.13.3 but got: $HELM_VERSION"
                exit 1
              fi
            fi
            # Also try PATH in case core.addPath worked
            if command -v helm >/dev/null 2>&1; then
              HELM_VERSION=$(helm version --short 2>&1)
              echo "helm version (from PATH): $HELM_VERSION"
              if echo "$HELM_VERSION" | grep -q "v3.13.3"; then
                echo "PASS: helm v3.13.3 is installed and in PATH"
                exit 0
              else
                echo "FAIL: expected helm v3.13.3 but got: $HELM_VERSION"
                exit 1
              fi
            fi
            echo "FAIL: action succeeded but helm binary not found anywhere"
            find /tmp/hostedtoolcache -type f 2>/dev/null | head -20 || true
            exit 1
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/API/environment issue in test harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
