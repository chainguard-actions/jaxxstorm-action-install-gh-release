name: Test install binary with explicit asset-name
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up runner environment
        run: |
          mkdir -p /tmp/hostedtoolcache
          mkdir -p /tmp/runner-temp
          echo "RUNNER_TOOL_CACHE=/tmp/hostedtoolcache" >> "$GITHUB_ENV"
          echo "RUNNER_TEMP=/tmp/runner-temp" >> "$GITHUB_ENV"
      - id: action
        uses: .
        with:
          repo: cli/cli
          tag: v2.40.0
          asset-name: gh
        continue-on-error: true
      - name: Assert gh binary is installed via explicit asset-name
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "Action succeeded, checking for gh binary..."
            # core.addPath may not persist in act; search the tool cache directly
            GH_BIN=$(find /tmp/hostedtoolcache -name "gh" -type f 2>/dev/null | head -1)
            if [ -n "$GH_BIN" ]; then
              echo "Found gh at: $GH_BIN"
              chmod +x "$GH_BIN"
              GH_VERSION=$("$GH_BIN" --version 2>&1 | head -1)
              echo "gh version: $GH_VERSION"
              if echo "$GH_VERSION" | grep -q "2.40.0"; then
                echo "PASS: gh 2.40.0 is installed via explicit asset-name"
                exit 0
              else
                echo "FAIL: expected gh 2.40.0 but got: $GH_VERSION"
                exit 1
              fi
            fi
            # Also try PATH in case core.addPath worked
            if command -v gh >/dev/null 2>&1; then
              GH_VERSION=$(gh --version 2>&1 | head -1)
              echo "gh version (from PATH): $GH_VERSION"
              if echo "$GH_VERSION" | grep -q "2.40.0"; then
                echo "PASS: gh 2.40.0 is installed and in PATH via explicit asset-name"
                exit 0
              else
                echo "FAIL: expected gh 2.40.0 but got: $GH_VERSION"
                exit 1
              fi
            fi
            echo "FAIL: action succeeded but gh binary not found anywhere"
            find /tmp/hostedtoolcache -type f 2>/dev/null | head -20 || true
            exit 1
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/API/environment issue in test harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
